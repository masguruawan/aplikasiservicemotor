<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Servis Motor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-900">

    <nav class="bg-blue-600 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="font-bold text-xl flex items-center gap-2">
                <i data-lucide="wrench"></i> Bengkel Digital
            </h1>
            <span id="status-badge" class="text-xs bg-blue-500 px-2 py-1 rounded">Online</span>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-4 md:p-6">
        <header class="mb-8">
            <h2 class="text-2xl font-extrabold text-slate-800">Riwayat Servis</h2>
            <p class="text-slate-500">Data real-time dari Spreadsheet</p>
        </header>

        <!-- Loading State -->
        <div id="loader" class="flex flex-col items-center justify-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
            <p class="mt-4 text-slate-500">Menghubungkan ke database...</p>
        </div>

        <!-- Container Kartu -->
        <div id="app-container" class="grid gap-4 grid-cols-1 md:grid-cols-2"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
